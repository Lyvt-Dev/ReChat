name: Build ReChat
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build/Release/ReChat.exe dist/
          windeployqt --release --no-translations dist/ReChat.exe
          Copy-Item README.md dist/
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing: $iscc" }
          & $iscc "/DAppVersion=0.1.0" "installer/ReChat.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/ReChat dist/
          cp README.md dist/
          cp assets/logo.svg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ReChat-${{ runner.os }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ReChat-Windows-Installer
          path: installer/output/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ReChat-Windows-Installer
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.exe --title "ReChat ${GITHUB_REF_NAME}" --generate-notes --verify-tag
